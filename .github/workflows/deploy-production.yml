# Checks and builds main, then pushes dist/ to the gh-pages branch. GitHub's built-in
# pages-build-deployment workflow then publishes that branch to
# https://jussimattila-monad.github.io/mastermind/. PR previews share the branch (see
# deploy-pr-preview.yml).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Keep PR previews, and rebase onto previews pushed meanwhile instead of overwriting them
          clean-exclude: pr-preview/
          force: false
