# Removes a PR's preview from gh-pages when the PR is closed or merged, and updates the
# preview comment. deploy-pr-preview.yml deploys it.
name: Remove PR preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# Shared with deploy-pr-preview.yml, so closing a PR cancels its deploy
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remove:
    # Forks never get a preview (see deploy-pr-preview.yml)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
