<import from="./code-peg"></import>
<import from="./feedback-pegs"></import>

<!-- Rows not played yet are hidden from screen readers; "N guesses left" says how many remain. -->
<div
  class="row row-${row.kind}"
  role="group"
  t="[aria-label]board.row"
  t-params.bind="{ n: row.number }"
  aria-current.bind="row.kind === 'current' ? 'step' : null"
  aria-hidden.bind="row.kind === 'empty' ? 'true' : null"
>
  <span class="row-number" aria-hidden="true">${row.number}</span>
  <span class="row-pegs">
    <!-- By index, so a slot button stays the same element (and keeps focus) when its color changes. -->
    <template repeat.for="i of row.pegs.length">
      <button
        if.bind="row.kind === 'current'"
        type="button"
        class="slot ${i === row.activeSlot ? 'slot-active' : ''}"
        data-board-input
        aria-pressed.bind="i === row.activeSlot"
        t.bind="row.pegs[i] ? '[aria-label]board.slot' : '[aria-label]board.emptySlot'"
        t-params.bind="{ n: i + 1, color: row.pegs[i] }"
        click.trigger="select?.(i)"
      >
        <code-peg color.bind="row.pegs[i]"></code-peg>
      </button>
      <code-peg else color.bind="row.pegs[i]"></code-peg>
    </template>
  </span>
  <feedback-pegs feedback.bind="row.feedback" pegs.bind="row.pegs.length"></feedback-pegs>
</div>
